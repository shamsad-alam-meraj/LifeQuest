name: Database migrations (manual)

# Production migrations run automatically on every Vercel production deploy (apps/web "vercel-build" script).
# This workflow is only for running them by hand, e.g. to migrate without deploying. It is manual-only on purpose:
# an automatic run here would race the deploy-time migration.
# Needs the repository secret DATABASE_URL (Supabase transaction-pooler string).
on:
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_ENV: production # tells the script this is an intentional production migration
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret is not set"; exit 1; fi
          npm run db:migrate:deploy -w @lifequest/web
